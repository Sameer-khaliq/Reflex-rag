name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_real_llm_tests:
        type: boolean
        default: false

env:
  QDRANT_URL: http://localhost:6333
  QDRANT_COLLECTION_NAME: self_correcting_rag_ci
  GROQ_API_KEY: ci-placeholder-key
  OPENROUTER_API_KEY: ci-placeholder-key
  TAVILY_API_KEY: ci-placeholder-key

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run python -c "from config import get_config; print(get_config())"
      - run: uv run pytest tests/unit -v -m "not real_llm"

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -f http://localhost:6333/collections || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-extras --dev
      - run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:6333/collections && break
            sleep 2
          done
      - run: uv run python scripts/ingest_corpus.py --fixture
      - run: uv run pytest tests/integration -v -m "not real_llm"

  real-llm-checkpoint:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_llm_tests
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-extras --dev
      - run: uv run python scripts/ingest_corpus.py
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run pytest -v -m real_llm