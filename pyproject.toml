[project]
name = "self-correcting-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sameer-khaliq", email = "sameerkhaliq58@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "google-genai>=2.20.0",
    "groq>=1.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
    "tavily-python>=0.8.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
]

[project.scripts]
self-correcting-rag = "self_correcting_rag:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
